<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: "Tip Sheet 2" }}</title>
  <style>
    :root {
      --text: #1d1d1f;
      --muted: #6e6e73;
      --bg: #ffffff;
      --surface: #f5f5f7;
      --border: #e5e5ea;
      --accent: #0071e3;
      --accent-hover: #0077ed;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      max-width: 880px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
    }
    .site-nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-bottom: 1rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }
    .site-nav .brand {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text);
      text-decoration: none;
    }
    .site-nav .nav-links {
      display: flex;
      gap: 1.25rem;
      font-size: 0.95rem;
    }
    h1, h2, h3 { line-height: 1.25; margin-top: 2rem; }
    h1 { font-size: 2.15rem; margin-top: 0.5rem; }
    h2 { font-size: 1.45rem; }
    h3 { font-size: 1.1rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code {
      background: var(--surface);
      padding: 0.1em 0.35em;
      border-radius: 4px;
      font-size: 0.92em;
    }
    hr { border: none; border-top: 1px solid var(--border); margin: 2.25rem 0; }
    em { color: var(--muted); }
    .hero {
      padding: 1rem 0 1.5rem;
    }
    .hero-tagline {
      font-size: 1.2rem;
      color: var(--muted);
      margin: 0.5rem 0 1.25rem;
      max-width: 640px;
    }
    .cta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      margin-top: 1.25rem;
    }
    .cta-button {
      display: inline-block;
      background: var(--accent);
      color: #ffffff !important;
      font-weight: 600;
      padding: 0.7rem 1.35rem;
      border-radius: 999px;
      text-decoration: none !important;
      transition: background 0.15s ease;
    }
    .cta-button:hover {
      background: var(--accent-hover);
    }
    .cta-subtext {
      font-size: 0.9rem;
      color: var(--muted);
    }
    .feature-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
      margin: 1.5rem 0;
    }
    .feature-card {
      background: var(--surface);
      border-radius: 12px;
      padding: 1.1rem 1.25rem;
    }
    .feature-card h3 {
      margin-top: 0;
      margin-bottom: 0.4rem;
      font-size: 1.05rem;
    }
    .feature-card p {
      margin: 0;
      font-size: 0.95rem;
      color: var(--muted);
    }
    .duo-showcase {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      align-items: center;
      margin: 1.5rem 0;
    }
    .duo-showcase figure,
    .screenshot-grid figure {
      margin: 0;
      text-align: center;
    }
    .duo-showcase img {
      max-width: 100%;
      max-height: 440px;
      width: auto;
      height: auto;
      border-radius: 14px;
    }
    .screenshot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.25rem;
      margin: 1.5rem 0;
    }
    .screenshot-grid img {
      max-width: 100%;
      max-height: 440px;
      width: auto;
      height: auto;
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }
    figcaption {
      margin-top: 0.5rem;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .site-footer {
      margin-top: 3.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .site-footer .footer-links {
      display: flex;
      gap: 1.25rem;
    }
  </style>
</head>
<body>
  <header class="site-nav">
    <a class="brand" href="./">Tip Sheet 2</a>
    <nav class="nav-links" aria-label="Primary">
      <a href="./">Overview</a>
      <a href="./support">Support</a>
      <a href="./legal">Privacy Policy</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>&copy; 2026 Rick Friele</span>
    <div class="footer-links">
      <a href="https://apps.apple.com/app/id6762172155">App Store</a>
      <a href="./support">Support</a>
      <a href="./legal">Privacy Policy</a>
    </div>
  </footer>
</body>
</html>
